# The two workloads and the public route.
#
# `image` is pinned by digest. Fleet reconciles with correctDrift enabled, so
# bumping the digest here is the only durable way to ship a release; the CI
# workflow publishes the image and prints the reference to pin.
#
# Both pods run as 10001:10001 with a read-only root filesystem. Neither needs a
# service account token, and neither mounts anything except the archive claim
# and a small writable /tmp (Go's resolver and the SQLite driver both want one).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aprs-archive-collector
  namespace: aprs
  annotations:
    helm.sh/resource-policy: keep
spec:
  # Exactly one collector. Two would double every stored packet and fight over
  # the single write lock; the archive is a record, not a replicated service.
  replicas: 1
  revisionHistoryLimit: 5
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: aprs-archive-collector
  template:
    metadata:
      labels:
        app.kubernetes.io/name: aprs-archive-collector
        app.kubernetes.io/part-of: aprs-archive
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
      - name: registry-credentials
      # The claim is a local volume on one node, so the pod must land there.
      nodeSelector:
        kubernetes.io/hostname: spainip-k3s
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      # A clean stop matters more than a fast one: the final batch is flushed
      # on SIGTERM and an in-flight transaction is committed, not abandoned.
      terminationGracePeriodSeconds: 60
      containers:
      - name: collector
        image: ghcr.io/ea7klk/aprs-archive@sha256:6c25af0452f8373a99d43bfe2c214b4f95bf7625e70ba98b84bc9e103182100f
        imagePullPolicy: IfNotPresent
        command: ["/usr/local/bin/aprs-archive-collector"]
        env:
        - name: APRS_ARCHIVE_DB
          value: /var/lib/aprs-archive/archive.db
        # Receive-only login. The passcode is derived from the base callsign
        # when unset, which is the documented algorithm; the SSID identifies
        # this service on APRS-IS and is not a user.
        - name: APRS_IS_CALLSIGN
          value: EA7KLK-15
        - name: APRS_IS_SERVER
          value: rotate.aprs2.net
        - name: APRS_IS_PORT
          value: "14580"
        - name: APRS_IS_FILTER
          value: t/m
        - name: APRS_ARCHIVE_RETENTION_DAYS
          value: "365"
        - name: APRS_ARCHIVE_SWEEP_HOURS
          value: "24"
        - name: APRS_ARCHIVE_FLUSH_SECONDS
          value: "2"
        - name: APRS_ARCHIVE_HEALTH_ADDR
          value: ":8081"
        ports:
        - name: health
          containerPort: 8081
          protocol: TCP
        # Liveness is the process: a deadlocked collector must be restarted.
        livenessProbe:
          httpGet:
            path: /livez
            port: health
          initialDelaySeconds: 10
          periodSeconds: 20
          timeoutSeconds: 3
          failureThreshold: 3
        # Readiness is the database, not APRS-IS. Being disconnected from the
        # network is normal and the collector retries; restarting it would not
        # bring the network back and would only churn the pod.
        readinessProbe:
          httpGet:
            path: /readyz
            port: health
          initialDelaySeconds: 5
          periodSeconds: 15
          timeoutSeconds: 3
          failureThreshold: 3
        resources:
          requests:
            cpu: 20m
            memory: 48Mi
          limits:
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        volumeMounts:
        - name: data
          mountPath: /var/lib/aprs-archive
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: aprs-archive-data
      - name: tmp
        emptyDir:
          sizeLimit: 16Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aprs-archive-web
  namespace: aprs
  annotations:
    helm.sh/resource-policy: keep
spec:
  replicas: 1
  revisionHistoryLimit: 5
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: aprs-archive-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: aprs-archive-web
        app.kubernetes.io/part-of: aprs-archive
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
      - name: registry-credentials
      nodeSelector:
        kubernetes.io/hostname: spainip-k3s
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      containers:
      - name: web
        image: ghcr.io/ea7klk/aprs-archive@sha256:6c25af0452f8373a99d43bfe2c214b4f95bf7625e70ba98b84bc9e103182100f
        imagePullPolicy: IfNotPresent
        command: ["/usr/local/bin/aprs-archive-web"]
        env:
        - name: APRS_ARCHIVE_DB
          value: /var/lib/aprs-archive/archive.db
        - name: APRS_ARCHIVE_ADDR
          value: ":8080"
        - name: APRS_ARCHIVE_LOCATION
          value: https://aprs.ea7klk.es
        - name: APRS_ARCHIVE_COLLECTOR_CALLSIGN
          value: EA7KLK-15
        - name: APRS_ARCHIVE_RETENTION_DAYS
          value: "365"
        - name: APRS_ARCHIVE_COLLECTOR_STALE_MINUTES
          value: "15"
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        # The web pod refuses to start until the collector has created the
        # schema, so its first start can take a few seconds after a cold bring-up.
        startupProbe:
          httpGet:
            path: /healthz
            port: http
          periodSeconds: 5
          failureThreshold: 60
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          periodSeconds: 30
          timeoutSeconds: 3
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /healthz
            port: http
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 2
        resources:
          requests:
            cpu: 20m
            memory: 48Mi
          limits:
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        volumeMounts:
        # Read-only at the mount as well as at the SQLite handle: two independent
        # guarantees that a web bug cannot alter the archive.
        - name: data
          mountPath: /var/lib/aprs-archive
          readOnly: true
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: aprs-archive-data
      - name: tmp
        emptyDir:
          sizeLimit: 16Mi
---
apiVersion: v1
kind: Service
metadata:
  name: aprs-archive-web
  namespace: aprs
  annotations:
    helm.sh/resource-policy: keep
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 8080
    protocol: TCP
    targetPort: http
  selector:
    app.kubernetes.io/name: aprs-archive-web
---
# Public route. IngressRoute is the estate default (infra TRAEFIK.md): it
# expresses entry points and middleware, and every application in this cluster
# uses it. The host is claimed here and nowhere else; an Ingress with the same
# host would silently lose to this route.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: aprs-archive
  namespace: aprs
  annotations:
    helm.sh/resource-policy: keep
spec:
  entryPoints:
  - websecure
  routes:
  - kind: Rule
    match: Host(`aprs.ea7klk.es`)
    services:
    - name: aprs-archive-web
      port: 8080
  tls:
    certResolver: acmeresolver
